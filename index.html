<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE ASISTENCIA</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --danger: #b91c1c;
            --success: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            border-top: 5px solid var(--primary);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .placa-badge {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .gps-status {
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.4;
        }

        .gps-loading {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: var(--accent);
        }

        .gps-error {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--danger);
            text-align: left;
        }

        .gps-error h3 {
            margin: 0 0 5px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            color: var(--danger);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            color: var(--text);
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .hidden { display: none; }

        .success-screen {
            text-align: center;
            padding: 20px 10px;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--success);
            margin-bottom: 15px;
        }

        .success-screen h2 {
            color: var(--success);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
        }

        .success-screen p {
            color: var(--accent);
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="card" id="appCard">
    <div class="header">
        <h1>REGISTRO DE ASISTENCIA</h1>
        <div id="placaBadge" class="placa-badge">---</div>
    </div>

    <div id="gpsStatus" class="gps-status gps-loading">
        🔄 Verificando parámetros del sistema y señal GPS... Por favor, espere.
    </div>

    <form id="dispatchForm" class="hidden">
        
        <!-- VISTA DE TÉCNICOS CORREGIDA -->
        <div id="camposTecnico" class="hidden">
            <div class="form-group">
                <label for="tecnico1">TECNICO 1</label>
                <input type="text" id="tecnico1" placeholder="COLOQUE SU NOMBRE COMPLETO" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="tecnico2">TECNICO 2</label>
                <input type="text" id="tecnico2" placeholder="COLOQUE SU NOMBRE COMPLETO" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="kilometraje">Kilometraje Entrada</label>
                <input type="text" id="kilometraje" placeholder="Solo números enteros. Ej. 145200" inputmode="numeric">
            </div>
        </div>

        <!-- VISTA DE COORDINADOR CORREGIDA -->
        <div id="camposCoordinador" class="hidden">
            <div class="form-group">
                <label for="coordinador">COORDINADOR</label>
                <input type="text" id="coordinador" placeholder="COLOQUE SU NOMBRE COMPLETO" autocomplete="off">
            </div>
        </div>

        <button type="submit" id="btnSubmit" disabled>Registrar Asistencia</button>
    </form>
    
    <div id="successScreen" class="success-screen hidden">
        <div class="success-icon">✓</div>
        <h2>Registro Completado</h2>
        <p>Los datos logísticos y de ubicación han sido validados y guardados de forma segura en el sistema corporativo.</p>
    </div>
</div>

<script>
    // Reemplaza esto con tu URL de Google Apps Script real
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlxNGfCFnx6Eb7MuRJi4VhwLZVzIrcw_iDQv7zUWeW1f5SBrq20kirRqnmxRwHZKU9Vw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    
    let gpsCoordinates = null;
    let rolDetectado = "";
    let identificadorDetectado = "";

    function inicializarSanitizadores() {
        const textInputs = document.querySelectorAll('input[type="text"]');
        textInputs.forEach(input => {
            input.addEventListener("input", (e) => {
                let valorLimpio = e.target.value.replace(/[<>\/\\"'`${}[\]]/g, "");
                e.target.value = valorLimpio.toUpperCase();
            });
        });

        const kilInput = document.getElementById("kilometraje");
        if(kilInput) {
            kilInput.addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, "");
            });
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        inicializarSanitizadores();
        
        if (!token) {
            bloquearFormulario("Acceso Denegado", "Por favor, escanee un código QR oficial de control de flota corporativa.");
            return;
        }

        try {
            const decoded = atob(token);
            const parts = decoded.split("|");
            if (parts.length !== 2) throw new Error();

            rolDetectado = parts[0].toUpperCase();
            identificadorDetectado = parts[1].toUpperCase();

            const badge = document.getElementById("placaBadge");
            if (rolDetectado === "SUPERVISOR") {
                badge.innerText = "COORDINADOR";
            } else {
                badge.innerText = `PLACA: ${identificadorDetectado}`;
            }

            verificarSeñalGPS();

        } catch (e) {
            bloquearFormulario("Error de Firma Digital", "El token proporcionado por el código QR es corrupto o inválido.");
        }
    });

    function verificarSeñalGPS() {
        if (!navigator.geolocation) {
            bloquearFormulario("Hardware Incompatible", "Este dispositivo móvil no cuenta con componentes de geolocalización activos.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                gpsCoordinates = `${position.coords.latitude},${position.coords.longitude}`;
                document.getElementById("gpsStatus").className = "hidden";
                
                const form = document.getElementById("dispatchForm");
                form.classList.remove("hidden");

                if (rolDetectado === "SUPERVISOR") {
                    document.getElementById("camposCoordinador").classList.remove("hidden");
                    document.getElementById("coordinador").required = true;
                } else {
                    document.getElementById("camposTecnico").classList.remove("hidden");
                    document.getElementById("tecnico1").required = true;
                    document.getElementById("kilometraje").required = true;
                }

                document.getElementById("btnSubmit").disabled = false;
            },
            (error) => {
                // MENSAJE DE ERROR DE GPS EXACTO SOLICITADO
                const banner = document.getElementById("gpsStatus");
                banner.className = "gps-status gps-error";
                banner.innerHTML = `
                    <h3>📡 Se requiere acceso a la ubicación</h3>
                    Para registrar su asistencia, debe activar el GPS de su dispositivo. Una vez activado, por favor recargue la página o vuelva a escanear el código QR para continuar.
                `;
                document.getElementById("btnSubmit").disabled = true;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    document.getElementById("dispatchForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!gpsCoordinates) return;

        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerText = "Sincronizando...";

        const payload = {
            token: token,
            gps: gpsCoordinates,
            tecnico1: document.getElementById("tecnico1")?.value || "",
            tecnico2: document.getElementById("tecnico2")?.value || "",
            kilometraje: document.getElementById("kilometraje")?.value || "",
            coordinador: document.getElementById("coordinador")?.value || ""
        };

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            document.getElementById("dispatchForm").classList.add("hidden");
            document.getElementById("gpsStatus").classList.add("hidden");
            document.getElementById("successScreen").classList.remove("hidden");
            
        } catch (err) {
            alert("Falla de conectividad en el canal de red. Intente nuevamente.");
            btn.disabled = false;
            btn.innerText = "Registrar Asistencia";
        }
    });

    function bloquearFormulario(titulo, mensaje) {
        const banner = document.getElementById("gpsStatus");
        banner.className = "gps-status gps-error";
        banner.innerHTML = `<h3>⚠️ ${titulo}</h3><p>${mensaje}</p>`;
        document.getElementById("dispatchForm").classList.add("hidden");
        document.getElementById("btnSubmit").disabled = true;
    }
</script>
</body>
</html>
