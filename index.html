<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE ASISTENCIA</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --danger: #b91c1c;
            --success: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            border-top: 5px solid var(--primary);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .placa-badge {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
        }

        .sub-sec {
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            background-color: #fafafa;
        }

        .gps-status {
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .gps-loading { background-color: #f1f5f9; color: var(--accent); }
        .gps-error { background-color: #fef2f2; color: var(--danger); }
        
        .form-group { margin-bottom: 18px; }
        .chk-group { margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem;}
        .chk-group input { width: auto; }

        label { display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--accent); }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        
        button.submit-btn { width: 100%; background-color: var(--primary); color: #fff; border: none; padding: 14px; font-size: 1rem; font-weight: bold; text-transform: uppercase; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .hidden { display: none; }
        .success-screen { text-align: center; padding: 20px 10px; }
        .success-icon { font-size: 3.5rem; color: var(--success); }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>REGISTRO DE ASISTENCIA</h1>
        <div id="placaBadge" class="placa-badge">REVISANDO...</div>
    </div>

    <div id="gpsStatus" class="gps-status gps-loading">
        📡 Evaluando credenciales y telemetría GPS... Por favor espere.
    </div>

    <form id="mainForm" class="hidden">
        
        <datalist id="lstNombresTecnicos"></datalist>
        <datalist id="lstNombresCoords"></datalist>
        <datalist id="lstNombresAdmins"></datalist>
        <datalist id="lstUsuariosUnicos"></datalist>

        <div id="panelTecnico" class="hidden">
            <div class="form-group">
                <label>TÉCNICO 1 (CONDUCTOR)</label>
                <input type="text" id="t1Nombre" list="lstNombresTecnicos" placeholder="SELECCIONE O ESCRIBA" autocomplete="off">
            </div>
            <div class="form-group">
                <label>USUARIO TÉCNICO 1</label>
                <input type="text" id="t1Usuario" list="lstUsuariosUnicos" placeholder="BUSQUE O COLOQUE MANUALMENTE" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>TÉCNICO 2</label>
                <input type="text" id="t2Nombre" list="lstNombresTecnicos" placeholder="SELECCIONE O ESCRIBA" autocomplete="off">
            </div>
            <div class="form-group">
                <label>USUARIO TÉCNICO 2</label>
                <input type="text" id="t2Usuario" list="lstUsuariosUnicos" placeholder="BUSQUE O COLOQUE MANUALMENTE" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Kilometraje Operativo de Entrada</label>
                <input type="text" id="kilometraje" placeholder="Ej. 120540" inputmode="numeric">
            </div>
        </div>

        <div id="panelCoordinador" class="hidden">
            <div class="form-group">
                <label>NOMBRE DEL COORDINADOR</label>
                <input type="text" id="coordinadorNombre" list="lstNombresCoords" placeholder="SELECCIONE NOMBRE" autocomplete="off">
            </div>
            <div class="form-group">
                <label>USUARIO DEL COORDINADOR</label>
                <input type="text" id="coordinadorUsuario" list="lstUsuariosUnicos" placeholder="SELECCIONE USUARIO" autocomplete="off">
            </div>

            <div class="chk-group">
                <input type="checkbox" id="chkAsumeT1" onchange="toggleCoordAsumeT1(this.checked)">
                <label for="chkAsumeT1" style="display:inline; text-transform:none;">AGREGAR TECNICO 2</label>
            </div>

            <div id="subPanelCoordT2" class="sub-sec hidden">
                <div class="form-group">
                    <label>TÉCNICO 2 ACOMPAÑANTE</label>
                    <input type="text" id="coordT2Nombre" list="lstNombresTecnicos" placeholder="SELECCIONE O ESCRIBA" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>USUARIO TÉCNICO 2</label>
                    <input type="text" id="coordT2Usuario" list="lstUsuariosUnicos" placeholder="BUSQUE O INGRESE USUARIO" autocomplete="off">
                </div>
            </div>
        </div>

        <div id="panelAdministrativo" class="hidden">
            <div class="form-group">
                <label>CARGO REGISTRADO</label>
                <select id="adminCargo">
                    <option value="">-- SELECCIONE UN CARGO --</option>
                </select>
            </div>
            <div class="form-group">
                <label>NOMBRE COMPLETO</label>
                <input type="text" id="adminNombre" list="lstNombresAdmins" placeholder="BUSQUE O ESCRIBA SU NOMBRE" autocomplete="off">
            </div>
            <div class="form-group">
                <label>USUARIO ASIGNADO</label>
                <input type="text" id="adminUsuario" list="lstUsuariosUnicos" placeholder="DIGITE O SELECCIONE USUARIO" autocomplete="off">
            </div>
        </div>

        <button type="submit" id="btnSubmit" class="submit-btn" disabled>Confirmar Registro</button>
    </form>
    
    <div id="successScreen" class="success-screen hidden">
        <div class="success-icon">✓</div>
        <h2>Sincronización Exitosa</h2>
        <p>Tu asistencia ha sido registrada de forma única y directa en la base de datos centralizada.</p>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkd0I3NGhwznZjlsWbB1lozY6UxCRQe4apYadSljRWgFCZ7tgz9ue0ysB2SSINKijDpw/exec"; // Coloca tu URL /exec aquí

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    
    let gpsCoordinates = null;
    let rolDetectado = "";
    let identificadorDetectado = "";
    let dbPersonalCompleto = [];

    document.addEventListener("DOMContentLoaded", async () => {
        setupSanitizers();
        if (!token) return showGlobalError("Acceso Denegado", "Se requiere escanear un código QR corporativo válido.");

        try {
            const decoded = atob(token);
            const parts = decoded.split("|");
            rolDetectado = parts[0].toUpperCase();
            identificadorDetectado = parts[1].toUpperCase();

            if (rolDetectado === "TECNICO") {
                document.getElementById("placaBadge").innerText = `PLACA: ${identificadorDetectado}`;
                const esOperativa = await validarPlacaUnidad(identificadorDetectado);
                if (!esOperativa) return showGlobalError("Unidad Inoperativa", "El vehículo asignado no está marcado como OPERATIVO.");
            } else if (rolDetectado === "SUPERVISOR") {
                document.getElementById("placaBadge").innerText = "COORDINADOR";
            } else if (rolDetectado === "ADMINISTRATIVO") {
                document.getElementById("placaBadge").innerText = "PERSONAL GESTIÓN";
            }

            await cargarYProcesarPersonal();
            iniciarGeolocalizacion();
        } catch(e) {
            showGlobalError("Token Corrupto", "El código QR escaneado no pertenece a la infraestructura.");
        }
    });

    async function cargarYProcesarPersonal() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getListaPersonal`);
            dbPersonalCompleto = await res.json();
            
            const setTecnicos = new Set();
            const setCoordinadores = new Set();
            const setAdministrativos = new Set();
            const setUsuariosTotales = new Set();
            const setCargosAdmin = new Set();

            dbPersonalCompleto.forEach(p => {
                const c = p.cargo.toUpperCase();
                
                if (p.usuario && (c.includes("TECNICO") || c.includes("COORDINADOR"))) {
                    setUsuariosTotales.add(p.usuario.toUpperCase());
                }

                if (c.includes("TECNICO")) {
                    setTecnicos.add(p.nombre);
                } else if (c.includes("COORDINADOR") || c.includes("COORDINADORA")) {
                    setCoordinadores.add(p.nombre);
                } else {
                    setAdministrativos.add(p.nombre);
                    if (p.cargo) setCargosAdmin.add(p.cargo.toUpperCase());
                }
            });

            inyectarDatalist("lstNombresTecnicos", setTecnicos);
            inyectarDatalist("lstNombresCoords", setCoordinadores);
            inyectarDatalist("lstNombresAdmins", setAdministrativos);
            inyectarDatalist("lstUsuariosUnicos", setUsuariosTotales);

            const selectCargo = document.getElementById("adminCargo");
            setCargosAdmin.forEach(cargo => {
                selectCargo.innerHTML += `<option value="${cargo}">${cargo}</option>`;
            });

            // PLAN B: SE ELIMINAN TODOS LOS ESCUCHADORES Y LOGICAS DE AUTOCOMPLETADO AUTOMATICO.
            // LOS CAMPOS SON 100% INDEPENDIENTES DESDE LA PRIMERA LETRA.

        } catch(e) { console.error("Fallo de sincronización."); }
    }

    function inyectarDatalist(idElemento, conjuntoDatos) {
        const elemento = document.getElementById(idElemento);
        elemento.innerHTML = "";
        conjuntoDatos.forEach(valor => { elemento.innerHTML += `<option value="${valor}">`; });
    }

    function toggleCoordAsumeT1(checkeado) {
        document.getElementById("subPanelCoordT2").classList.toggle("hidden", !checkeado);
    }

    async function validarPlacaUnidad(placa) {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getValidarPlaca&placa=${placa}`);
            const data = await res.json();
            return data.operativa;
        } catch(e) { return false; }
    }

    function iniciarGeolocalizacion() {
        if (!navigator.geolocation) return showGlobalError("Hardware Ausente", "El terminal no posee soporte GPS.");
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                gpsCoordinates = `${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById("gpsStatus").className = "hidden";
                document.getElementById("mainForm").classList.remove("hidden");

                if (rolDetectado === "TECNICO") {
                    document.getElementById("panelTecnico").classList.remove("hidden");
                    document.getElementById("t1Nombre").required = true;
                    document.getElementById("kilometraje").required = true;
                } else if (rolDetectado === "SUPERVISOR") {
                    document.getElementById("panelCoordinador").classList.remove("hidden");
                    document.getElementById("coordinadorNombre").required = true;
                } else if (rolDetectado === "ADMINISTRATIVO") {
                    document.getElementById("panelAdministrativo").classList.remove("hidden");
                    document.getElementById("adminCargo").required = true;
                    document.getElementById("adminNombre").required = true;
                }
                document.getElementById("btnSubmit").disabled = false;
            },
            (err) => {
                const banner = document.getElementById("gpsStatus");
                banner.className = "gps-status gps-error";
                banner.innerHTML = `<h3>📡 GPS Desactivado</h3>Debe autorizar el permiso de ubicación para guardar la asistencia técnica.`;
            },
            { enableHighAccuracy: true, timeout: 12000 }
        );
    }

    document.getElementById("mainForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerText = "Sincronizando...";

        const asumeOperativo = document.getElementById("chkAsumeT1")?.checked || false;

        const payload = {
            token: token,
            gps: gpsCoordinates,
            coordAsumeT1: asumeOperativo,
            esAdministrativo: (rolDetectado === "ADMINISTRATIVO"),
            t1Nombre: document.getElementById("t1Nombre")?.value || "",
            t1Usuario: document.getElementById("t1Usuario")?.value || "",
            t2Nombre: asumeOperativo ? document.getElementById("coordT2Nombre")?.value : document.getElementById("t2Nombre")?.value || "",
            t2Usuario: asumeOperativo ? document.getElementById("coordT2Usuario")?.value : document.getElementById("t2Usuario")?.value || "",
            kilometraje: document.getElementById("kilometraje")?.value || "",
            coordinadorNombre: document.getElementById("coordinadorNombre")?.value || "",
            coordinadorUsuario: document.getElementById("coordinadorUsuario")?.value || "",
            adminCargo: document.getElementById("adminCargo")?.value || "",
            adminNombre: document.getElementById("adminNombre")?.value || "",
            adminUsuario: document.getElementById("adminUsuario")?.value || ""
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            document.getElementById("mainForm").classList.add("hidden");
            document.getElementById("successScreen").classList.remove("hidden");
        } catch(err) {
            alert("Error en la transmisión de datos.");
            btn.disabled = false;
            btn.innerText = "Confirmar Registro";
        }
    });

    function setupSanitizers() {
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener("input", (e) => {
                if(e.inputType) {
                    e.target.value = e.target.value.replace(/[<>\/\\"'`${}[\]]/g, "").toUpperCase();
                }
            });
        });
        const km = document.getElementById("kilometraje");
        if(km) km.addEventListener("input", (e) => e.target.value = e.target.value.replace(/[^0-9]/g, ""));
    }

    function showGlobalError(tit, msg) {
        const banner = document.getElementById("gpsStatus");
        banner.className = "gps-status gps-error";
        banner.innerHTML = `<h3>⚠️ ${tit}</h3><p>${msg}</p>`;
    }
</script>
</body>
</html>
