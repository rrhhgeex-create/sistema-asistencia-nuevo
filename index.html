<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE ASISTENCIA</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --danger: #b91c1c;
            --success: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            border-top: 5px solid var(--primary);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .placa-badge {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .gps-status {
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.4;
        }

        .gps-loading {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: var(--accent);
        }

        .gps-error {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--danger);
        }

        .gps-error h3 {
            margin: 0 0 5px 0;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            color: var(--text);
            background-color: #fff;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .hidden { display: none; }

        .success-screen {
            text-align: center;
            padding: 20px 10px;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--success);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>REGISTRO DE ASISTENCIA</h1>
        <div id="placaBadge" class="placa-badge">---</div>
    </div>

    <div id="gpsStatus" class="gps-status gps-loading">
        🔄 Verificando parámetros del sistema y señal GPS... Por favor, espere.
    </div>

    <form id="mainForm" class="hidden">
        
        <datalist id="listaPersonalNombres"></datalist>
        <datalist id="listaPersonalUsuarios"></datalist>

        <div id="camposTecnico" class="hidden">
            <div class="form-group">
                <label>TECNICO 1</label>
                <input type="text" id="t1Nombre" list="listaPersonalNombres" placeholder="COLOQUE SU NOMBRE COMPLETO">
            </div>
            <div class="form-group">
                <label>USUARIO TECNICO 1</label>
                <input type="text" id="t1Usuario" list="listaPersonalUsuarios" placeholder="COLOQUE SU USUARIO">
            </div>
            
            <div class="form-group">
                <label>TECNICO 2</label>
                <input type="text" id="t2Nombre" list="listaPersonalNombres" placeholder="COLOQUE SU NOMBRE COMPLETO">
            </div>
            <div class="form-group">
                <label>USUARIO TECNICO 2</label>
                <input type="text" id="t2Usuario" list="listaPersonalUsuarios" placeholder="COLOQUE SU USUARIO">
            </div>

            <div class="form-group">
                <label>Kilometraje Entrada</label>
                <input type="text" id="kilometraje" placeholder="Solo números enteros. Ej. 145200" inputmode="numeric">
            </div>
        </div>

        <div id="camposCoordinador" class="hidden">
            <div class="form-group">
                <label>COORDINADOR</label>
                <input type="text" id="coordinadorNombre" list="listaPersonalNombres" placeholder="COLOQUE SU NOMBRE COMPLETO">
            </div>
            <div class="form-group">
                <label>USUARIO COORDINADOR</label>
                <input type="text" id="coordinadorUsuario" list="listaPersonalUsuarios" placeholder="COLOQUE SU USUARIO">
            </div>
        </div>

        <button type="submit" id="btnSubmit" disabled>Registrar Asistencia</button>
    </form>
    
    <div id="successScreen" class="success-screen hidden">
        <div class="success-icon">✓</div>
        <h2>Registro Completado</h2>
        <p>Los datos logísticos y de ubicación han sido validados y guardados de forma segura en el sistema corporativo.</p>
    </div>
</div>

<script>
    // URL de tu implementación de Google Apps Script Ejecutable
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkd0I3NGhwznZjlsWbB1lozY6UxCRQe4apYadSljRWgFCZ7tgz9ue0ysB2SSINKijDpw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    
    let gpsCoordinates = null;
    let rolDetectado = "";
    let identificadorDetectado = "";
    let databasePersonal = [];

    document.addEventListener("DOMContentLoaded", async () => {
        setupSanitizers();
        if (!token) return showGlobalError("Acceso Denegado", "Escanee un código QR oficial.");

        try {
            const decoded = atob(token);
            const parts = decoded.split("|");
            rolDetectado = parts[0].toUpperCase();
            identificadorDetectado = parts[1].toUpperCase();

            document.getElementById("placaBadge").innerText = (rolDetectado === "SUPERVISOR") ? "COORDINADOR" : `PLACA: ${identificadorDetectado}`;
            
            // Descargar lista del personal activo en segundo plano
            await cargarBasePersonal();
            
            // Si es Técnico, validar que la placa esté OPERATIVA antes de habilitar el flujo
            if (rolDetectado === "TECNICO") {
                const esOperativa = await validarUnidadOperativa(identificadorDetectado);
                if (!esOperativa) return showGlobalError("Unidad No Operativa", "Esta placa no se encuentra marcada como OPERATIVA.");
            }

            iniciarValidacionGPS();
        } catch(e) {
            showGlobalError("Token Inválido", "El código QR escaneado no pertenece al sistema corporativo.");
        }
    });

    async function cargarBasePersonal() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getListaPersonal`);
            databasePersonal = await res.json();
            
            const dlNombres = document.getElementById("listaPersonalNombres");
            const dlUsuarios = document.getElementById("listaPersonalUsuarios");
            
            databasePersonal.forEach(p => {
                dlNombres.innerHTML += `<option value="${p.nombre}">`;
                dlUsuarios.innerHTML += `<option value="${p.usuario}">`;
            });

            // Enlace inteligente interactivo para autocompletar Usuarios <-> Nombres
            setupEnlaceCampos("t1Nombre", "t1Usuario");
            setupEnlaceCampos("t2Nombre", "t2Usuario");
            setupEnlaceCampos("coordinadorNombre", "coordinadorUsuario");
        } catch(e) { console.log("Error al precargar personal."); }
    }

    async function validarUnidadOperativa(placa) {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getValidarPlaca&placa=${placa}`);
            const obj = await res.json();
            return obj.operativa;
        } catch(e) { return false; }
    }

    function setupEnlaceCampos(idNombre, idUsuario) {
        const inputNombre = document.getElementById(idNombre);
        const inputUsuario = document.getElementById(idUsuario);
        if(!inputNombre || !inputUsuario) return;

        inputNombre.addEventListener("change", (e) => {
            const match = databasePersonal.find(p => p.nombre === e.target.value);
            if(match) inputUsuario.value = match.usuario;
        });

        inputUsuario.addEventListener("change", (e) => {
            const match = databasePersonal.find(p => p.usuario === e.target.value.toUpperCase());
            if(match) inputNombre.value = match.nombre;
        });
    }

    function iniciarValidacionGPS() {
        if (!navigator.geolocation) return showGlobalError("Error de Hardware", "GPS no soportado.");

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                gpsCoordinates = `${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById("gpsStatus").className = "hidden";
                document.getElementById("mainForm").classList.remove("hidden");

                if (rolDetectado === "SUPERVISOR") {
                    document.getElementById("camposCoordinador").classList.remove("hidden");
                    document.getElementById("coordinadorNombre").required = true;
                } else {
                    document.getElementById("camposTecnico").classList.remove("hidden");
                    document.getElementById("t1Nombre").required = true;
                    document.getElementById("t1Usuario").required = true;
                    document.getElementById("kilometraje").required = true;
                }
                document.getElementById("btnSubmit").disabled = false;
            },
            (err) => {
                const banner = document.getElementById("gpsStatus");
                banner.className = "gps-status gps-error";
                banner.innerHTML = `
                    <h3>📡 Se requiere acceso a la ubicación</h3>
                    Para registrar su asistencia, debe activar el GPS de su dispositivo. Una vez activado, por favor recargue la página o vuelva a escanear el código QR para continuar.
                `;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    document.getElementById("mainForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerText = "Registrando...";

        const payload = {
            token: token,
            gps: gpsCoordinates,
            t1Nombre: document.getElementById("t1Nombre")?.value || "",
            t1Usuario: document.getElementById("t1Usuario")?.value || "",
            t2Nombre: document.getElementById("t2Nombre")?.value || "",
            t2Usuario: document.getElementById("t2Usuario")?.value || "",
            kilometraje: document.getElementById("kilometraje")?.value || "",
            coordinadorNombre: document.getElementById("coordinadorNombre")?.value || "",
            coordinadorUsuario: document.getElementById("coordinadorUsuario")?.value || ""
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(payload)
            });
            document.getElementById("mainForm").classList.add("hidden");
            document.getElementById("successScreen").classList.remove("hidden");
        } catch(err) {
            alert("Error de red.");
            btn.disabled = false;
        }
    });

    function setupSanitizers() {
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[<>\/\\"'`${}[\]]/g, "").toUpperCase();
            });
        });
        const km = document.getElementById("kilometraje");
        if(km) km.addEventListener("input", (e) => e.target.value = e.target.value.replace(/[^0-9]/g, ""));
    }

    function showGlobalError(tit, msg) {
        const banner = document.getElementById("gpsStatus");
        banner.className = "gps-status gps-error";
        banner.innerHTML = `<h3>⚠️ ${tit}</h3><p>${msg}</p>`;
    }
</script>
</body>
</html>
