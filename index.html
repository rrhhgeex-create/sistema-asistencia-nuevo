<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Flotas - Login Homologado</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #334155;
            --text-color: #1e293b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --danger-color: #991b1b;
            --success-color: #166534;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--primary-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            margin: 3px;
            text-transform: uppercase;
        }

        .gps-banner {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: var(--danger-color);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .hidden { display: none; }
        
        #message {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .error { background-color: #fee2e2; color: var(--danger-color); }
        .success { background-color: #dcfce7; color: var(--success-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Control de Despachos</h1>
        <div id="placaBadge" class="badge">PLACA: --</div>
        <div id="rolBadge" class="badge">ROL: --</div>
    </div>

    <div id="gpsBanner" class="gps-banner">
        ⚠️ ATENCIÓN: Se requiere GPS Activo por hardware para habilitar el formulario.
    </div>

    <form id="mainForm">
        <div id="sectionTecnicos" class="hidden">
            <div class="form-group">
                <label for="tecnico1">Técnico 1 (Conductor)</label>
                <select id="tecnico1" class="select-personal"></select>
            </div>
            <div class="form-group">
                <label for="tecnico2">Técnico 2 (Copiloto)</label>
                <select id="tecnico2" class="select-personal"></select>
            </div>
            <div class="form-group">
                <label for="kilometraje">Kilometraje Entrada</label>
                <input type="number" id="kilometraje" min="0" placeholder="Ej. 145200">
            </div>
        </div>

        <div id="sectionSupervisor" class="hidden">
            <div class="form-group">
                <label for="supervisor">Nombre del Coordinador</label>
                <select id="supervisor" class="select-personal"></select>
            </div>
        </div>

        <button type="submit" id="btnSubmit" disabled>Registrar Asistencia</button>
    </form>

    <div id="message" class="hidden"></div>
</div>

<script>
    // CAMBIA ESTA URL POR LA DE TU IMPLEMENTACIÓN DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlxNGfCFnx6Eb7MuRJi4VhwLZVzIrcw_iDQv7zUWeW1f5SBrq20kirRqnmxRwHZKU9Vw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t'); // Captura el parámetro obfuscado '?t='
    
    let gpsCoordinates = null;
    let tokenValido = false;
    let placaDetectada = "";
    let rolDetectado = "";

    document.addEventListener("DOMContentLoaded", () => {
        validarYDescifrarTokenLocal();
        if(tokenValido) {
            inicializarCapturaGPS();
        }
    });

    // Descifrado preventivo en Frontend para adaptar la interfaz visual
    function validarYDescifrarTokenLocal() {
        const msgDiv = document.getElementById("message");
        if (!token) {
            mostrarError("ERROR CRÍTICO: Escanee el código QR oficial de la unidad. Acceso denegado.");
            return;
        }
        try {
            const decoded = atob(token); // Descifrado Base64 estándar
            const parts = decoded.split("|");
            if (parts.length !== 2) throw new Error();
            
            rolDetectado = parts[0].toLowerCase();
            placaDetectada = parts[1].toUpperCase();
            tokenValido = true;

            document.getElementById("placaBadge").innerText = `PLACA: ${placaDetectada}`;
            document.getElementById("rolBadge").innerText = `ROL: ${rolDetectado}`;

            if (rolDetectado === 'supervisor') {
                document.getElementById("sectionSupervisor").classList.remove("hidden");
                document.getElementById("supervisor").required = true;
            } else {
                document.getElementById("sectionTecnicos").classList.remove("hidden");
                document.getElementById("tecnico1").required = true;
                document.getElementById("tecnico2").required = true;
                document.getElementById("kilometraje").required = true;
                cargarListaPersonal();
            }
        } catch (e) {
            mostrarError("FALSA ALERTA / PARÁMETRO ALTERADO: El token del código QR ha sido corrompido.");
        }
    }

    // Inicializa el tracking de GPS estricto (Hardware anti-VPN)
    function inicializarCapturaGPS() {
        if (!navigator.geolocation) {
            mostrarError("Este dispositivo no cuenta con soporte de geolocalización.");
            return;
        }

        navigator.geolocation.watchPosition(
            (position) => {
                gpsCoordinates = `${position.coords.latitude},${position.coords.longitude}`;
                // Desbloqueo nativo del formulario al validar hardware activo
                document.getElementById("gpsBanner").classList.add("hidden");
                document.getElementById("btnSubmit").disabled = false;
            },
            (error) => {
                gpsCoordinates = null;
                document.getElementById("gpsBanner").classList.remove("hidden");
                document.getElementById("gpsBanner").innerText = "⚠️ CONFIGURACIÓN REQUERIDA: Encienda el GPS de alta precisión en su celular y actualice la aplicación.";
                document.getElementById("btnSubmit").disabled = true;
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 } // Desactiva caché de IP (Evita bypass sencillos de VPN)
        );
    }

    async function cargarListaPersonal() {
        try {
            const response = await fetch(WEB_APP_URL);
            const result = await response.json();
            if (result.status === "success") {
                const selects = document.querySelectorAll(".select-personal");
                selects.forEach(select => {
                    select.innerHTML = '<option value="">-- BUSQUE SU NOMBRE --</option>';
                    result.data.forEach(name => {
                        const opt = document.createElement("option");
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    });
                });
            }
        } catch (err) {
            console.error("Falla de red cargando base de datos.");
        }
    }

    document.getElementById("mainForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!gpsCoordinates) {
            alert("No se puede enviar sin señal GPS verificada.");
            return;
        }

        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        mostrarMensaje("Procesando firma y emitiendo registros...", "success");

        const payload = {
            token: token,
            gps: gpsCoordinates,
            tecnico1: document.getElementById("tecnico1")?.value || "",
            tecnico2: document.getElementById("tecnico2")?.value || "",
            kilometraje: document.getElementById("kilometraje")?.value || "",
            supervisor: document.getElementById("supervisor")?.value || ""
        };

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // Éxito ciego (por política no-cors)
            mostrarMensaje("✓ ASISTENCIA ASENTADA EN MAYÚSCULAS.", "success");
            document.getElementById("mainForm").reset();
            setTimeout(() => { location.reload(); }, 2000); // Forzar refresco operativo
        } catch (error) {
            mostrarMensaje("Error en la pasarela de red. Reintente.", "error");
            btn.disabled = false;
        }
    });

    function mostrarError(txt) {
        const m = document.getElementById("message");
        m.className = "error";
        m.innerText = txt;
        m.classList.remove("hidden");
        document.getElementById("mainForm").classList.add("hidden");
    }

    function mostrarMensaje(txt, clase) {
        const m = document.getElementById("message");
        m.className = clase;
        m.innerText = txt;
        m.classList.remove("hidden");
    }
</script>
</body>
</html>
