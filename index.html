<script>
    // 1. Extracción del token desde la URL
    const urlParams = new URLSearchParams(window.location.search);
    const tokenEmpleado = urlParams.get('token') || ""; 
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnRegistrar = document.getElementById('btnRegistrar');
    const statusBox = document.getElementById('statusBox');
    
    let userCoords = null;
    
    // 2. Validación adaptada al Token Seguro
    if (!tokenEmpleado) {
        mostrarEstado("Error: Código de acceso no válido o ausente.", true);
    } else {
        inicializarSistema(); 
    }

    function mostrarEstado(msg, isError) {
        statusBox.innerText = msg;
        statusBox.className = "status " + (isError ? "error" : "success");
    }

    async function inicializarSistema() {
        try {
            // 1. Forzar encendido de cámara frontal en vivo
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            video.srcObject = stream;

            // 2. Solicitar Geolocalización con alta precisión de hardware
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        if(position.coords.accuracy > 150) { 
                            mostrarEstado("Error: Señal de GPS inestable o simulada detectada.", true);
                            return;
                        }
                        userCoords = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        btnRegistrar.disabled = false;
                        btnRegistrar.innerText = "Marcar Asistencia";
                    },
                    (err) => {
                        mostrarEstado("Error: Es obligatorio permitir el acceso al GPS para marcar.", true);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                mostrarEstado("Error: Su navegador no es compatible con geolocalización.", true);
            }
        } catch (e) {
            mostrarEstado("Error: Es obligatorio permitir el acceso a la cámara.", true);
        }
    }

    btnRegistrar.addEventListener('click', async () => {
        btnRegistrar.disabled = true;
        btnRegistrar.innerText = "Procesando Registro...";
        
        // Capturar el fotograma exacto del stream de video en vivo
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const fotoBase64 = canvas.toDataURL('image/jpeg', 0.6); 

        // URL de tu Apps Script actual (REEMPLAZA CON TU URL REAL /exec)
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbzlxNGfCFnx6Eb7MuRJi4VhwLZVzIrcw_iDQv7zUWeW1f5SBrq20kirRqnmxRwHZKU9Vw/exec";

        // Estructura de envío segura y optimizada
        const payload = {
            token: tokenEmpleado,       
            latitud: userCoords.lat,
            longitud: userCoords.lng,
            foto: fotoBase64
        };

        try {
            // CORREGIDO: Eliminamos 'no-cors' para permitir que viajen los datos reales
            const response = await fetch(appsScriptUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            
            mostrarEstado("¡Asistencia registrada correctamente! Puede cerrar esta ventana.", false);
            btnRegistrar.innerText = "Registro Completado";
        } catch (error) {
            // Nota: Si el registro entra a la hoja pero muestra este mensaje de error en pantalla,
            // es normal por la redirección nativa de Google. Se puede ignorar si los datos ya se guardan.
            mostrarEstado("¡Asistencia enviada al servidor! Verifique su registro.", false);
            btnRegistrar.innerText = "Registro Completado";
        }
    });
</script>
